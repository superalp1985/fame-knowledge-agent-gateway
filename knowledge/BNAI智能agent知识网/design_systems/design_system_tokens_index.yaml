jianmu_decision_rules:
  finance_governance:
    base_system: ibm_carbon
    color_family: [gray, coolGray, blue60]
    radius_px: [0, 4, 8, 12]
    spacing_px: [16, 24, 32, 48]
    accent_area_max_percent: 15
  data_dashboard:
    base_system: ibm_carbon
    grid_columns: 16
    status_colors: {primary: '#0f62fe', danger: '#da1e28', success: '#198038', warning: '#f1c21b'}
  course_ppt:
    base_system: material_design_3
    title_px: [32, 36, 45, 57]
    body_px: [16, 20, 24]
    radius_px: [8, 12, 16]
    accent_area_max_percent: 15
  video_infographic:
    title_min_px_1080p: 48
    subtitle_min_px_1080p: 36
    corner_label_min_px_1080p: 24
    transition_ms: {feedback: [100, 200], segment: [300, 600], chapter: [700, 1000]}
quality_gates:
  - color_must_trace_to_token_or_explicit_hex
  - type_must_specify_size_line_height_weight
  - spacing_must_use_4_or_8_px_family_or_explain_exception
  - motion_must_have_semantic_purpose
  - status_color_must_have_text_or_icon_redundancy
  - preview_is_not_final
