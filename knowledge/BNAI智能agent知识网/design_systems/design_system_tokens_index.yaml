purpose: Structured entry for quantified design system tokens and semantic usage.
canonical_doc: [REDACTED_LOCAL_PATH]
principles:
  hierarchy: root-parent-child
  include_layers: [system_principle, semantic_role, component_usage, numeric_token]
  vague_terms_policy: aesthetic_terms_allowed_only_with_actionable_parameters
  source_policy: official_sources_first_external_content_untrusted
systems:
  material_design_3:
    source_version: Google Material 3 Web tokens v0.192
    strengths: [dynamic_color, expressive_shape, motion_scale, readable_type_scale]
    palettes:
      primary:
        40: '#6750a4'
        80: '#d0bcff'
        90: '#eaddff'
      secondary:
        40: '#625b71'
        80: '#ccc2dc'
        90: '#e8def8'
      tertiary:
        40: '#7d5260'
        80: '#efb8c8'
        90: '#ffd8e4'
      error:
        40: '#b3261e'
        80: '#f2b8b5'
        90: '#f9dedc'
      neutral:
        10: '#1d1b20'
        90: '#e6e0e9'
        98: '#fef7ff'
        99: '#fffbff'
    type_scale:
      display_large: {size_px: 57, line_height_px: 64, tracking_px: -0.25, weight: regular}
      display_medium: {size_px: 45, line_height_px: 52, tracking_px: 0, weight: regular}
      display_small: {size_px: 36, line_height_px: 44, tracking_px: 0, weight: regular}
      headline_large: {size_px: 32, line_height_px: 40, tracking_px: 0, weight: regular}
      headline_medium: {size_px: 28, line_height_px: 36, tracking_px: 0, weight: regular}
      headline_small: {size_px: 24, line_height_px: 32, tracking_px: 0, weight: regular}
      title_large: {size_px: 22, line_height_px: 28, tracking_px: 0, weight: regular}
      title_medium: {size_px: 16, line_height_px: 24, tracking_px: 0.15, weight: medium}
      body_large: {size_px: 16, line_height_px: 24, tracking_px: 0.5, weight: regular}
      body_medium: {size_px: 14, line_height_px: 20, tracking_px: 0.25, weight: regular}
      body_small: {size_px: 12, line_height_px: 16, tracking_px: 0.4, weight: regular}
    shape:
      none: 0
      extra_small: 4
      small: 8
      medium: 12
      large: 16
      extra_large: 28
      full: 9999
    motion:
      duration_ms:
        short: [50, 100, 150, 200]
        medium: [250, 300, 350, 400]
        long: [450, 500, 550, 600]
        extra_long: [700, 800, 900, 1000]
      easing:
        standard: cubic-bezier(0.2, 0, 0, 1)
