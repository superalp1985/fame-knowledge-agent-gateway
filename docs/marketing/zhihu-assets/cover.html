<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FAME Knowledge Agent Gateway Cover</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        font-family:
          "Microsoft YaHei UI",
          "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          Arial,
          sans-serif;
        color: #102626;
        background:
          radial-gradient(circle at 74% 18%, rgba(33, 134, 130, 0.16), transparent 34%),
          radial-gradient(circle at 92% 80%, rgba(197, 78, 96, 0.12), transparent 28%),
          linear-gradient(135deg, #f7fbfa 0%, #eef6f2 45%, #f7f8f5 100%);
      }

      .cover {
        position: relative;
        width: 1600px;
        height: 900px;
        padding: 74px 84px;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(16, 38, 38, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 38, 38, 0.05) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.05));
      }

      .content {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 580px 1fr;
        gap: 84px;
        height: 100%;
        align-items: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border: 1px solid rgba(25, 122, 116, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        color: #197a74;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .mark {
        width: 22px;
        height: 22px;
        border: 5px solid #197a74;
        border-radius: 8px;
        transform: rotate(45deg);
      }

      h1 {
        margin: 32px 0 0;
        max-width: 560px;
        font-size: 66px;
        line-height: 1.05;
        letter-spacing: 0;
        font-weight: 900;
        color: #142828;
      }

      .subtitle {
        margin-top: 26px;
        max-width: 560px;
        font-size: 30px;
        line-height: 1.34;
        font-weight: 780;
        color: #2c4a4a;
      }

      .proof {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 44px;
        max-width: 560px;
      }

      .proof div {
        min-height: 82px;
        padding: 16px 18px;
        border: 1px solid rgba(25, 122, 116, 0.16);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 18px 48px rgba(33, 79, 74, 0.08);
      }

      .proof strong {
        display: block;
        color: #197a74;
        font-size: 29px;
        line-height: 1;
        font-weight: 900;
      }

      .proof span {
        display: block;
        margin-top: 8px;
        color: #4b6665;
        font-size: 18px;
        line-height: 1.24;
        font-weight: 700;
      }

      .visual {
        position: relative;
        height: 704px;
        min-width: 0;
      }

      .shot {
        position: absolute;
        border-radius: 16px;
        border: 1px solid rgba(22, 52, 51, 0.16);
        box-shadow: 0 26px 78px rgba(17, 48, 47, 0.2);
        object-fit: cover;
        background: #fff;
      }

      .shot.main {
        right: 0;
        top: 10px;
        width: 760px;
        height: 476px;
        object-position: center center;
      }

      .shot.secondary {
        left: 0;
        bottom: 22px;
        width: 508px;
        height: 286px;
        object-position: left top;
      }

      .ribbon {
        position: absolute;
        right: 20px;
        bottom: 66px;
        width: 404px;
        padding: 20px 24px;
        border-radius: 16px;
        color: #fff;
        background: linear-gradient(135deg, #167c78, #114a4a);
        box-shadow: 0 20px 60px rgba(17, 74, 74, 0.28);
      }

      .ribbon strong {
        display: block;
        font-size: 28px;
        line-height: 1.1;
        font-weight: 900;
      }

      .ribbon span {
        display: block;
        margin-top: 10px;
        font-size: 18px;
        line-height: 1.28;
        color: rgba(255, 255, 255, 0.86);
        font-weight: 650;
      }

      .footer {
        position: absolute;
        left: 84px;
        bottom: 42px;
        z-index: 3;
        font-size: 20px;
        font-weight: 750;
        color: #5c7170;
      }

      .corner {
        position: absolute;
        right: 44px;
        top: 42px;
        z-index: 3;
        display: flex;
        gap: 10px;
      }

      .pill {
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(25, 122, 116, 0.16);
        background: rgba(255, 255, 255, 0.72);
        color: #197a74;
        font-size: 18px;
        font-weight: 820;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <div class="grid"></div>
      <div class="corner">
        <span class="pill">Apache-2.0</span>
        <span class="pill">v0.1.0</span>
      </div>
      <section class="content">
        <div>
          <div class="eyebrow"><span class="mark"></span>FAME Knowledge Agent Gateway</div>
          <h1>Agent 本地外脑</h1>
          <p class="subtitle">让工具调用更稳，让工程记忆可复用，让知识网参与路线判断。</p>
          <div class="proof">
            <div>
              <strong>8/8</strong>
              <span>中文与英文实机评测通过</span>
            </div>
            <div>
              <strong>2714</strong>
              <span>route records 可按范围调用</span>
            </div>
            <div>
              <strong>15</strong>
              <span>MCP tools 接入运行时网关</span>
            </div>
            <div>
              <strong>0</strong>
              <span>知识网检查 errors / warnings</span>
            </div>
          </div>
        </div>
        <div class="visual">
          <img class="shot main" src="./02-3d-knowledge-universe.png" alt="3D 知识宇宙" />
          <img class="shot secondary" src="./01-agent-external-brain.png" alt="Agent 外脑控制台" />
          <div class="ribbon">
            <strong>路线、记忆、审批、失败教训</strong>
            <span>把现有 Coding Agent 接到一个可视化、可扩展、可审计的工程知识层。</span>
          </div>
        </div>
      </section>
      <div class="footer">github.com/superalp1985/fame-knowledge-agent-gateway</div>
    </main>
  </body>
</html>
